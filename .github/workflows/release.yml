name: Release

on:
  push:
    branches: [main]

# semantic-release needs contents:write for the tag and the release, and
# issues/pull-requests:write for the comments it leaves on what it released.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history, so the commit analyzer can find the previous tag
          fetch-depth: 0

      # Derives the next version from the conventional-commit messages and creates the tag
      # and the GitHub release. It outputs an empty tag when there is nothing to release.
      # Pinned to a commit rather than a moving tag: this repository asks its own callers to
      # pin, and Dependabot cannot update a `@latest` reference.
      - name: Release
        id: release
        uses: huggingface/semver-release-action@1a164868d29fb12acd39d70e8e47326db9d78ad2 # v1.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This has to live in the same job. A release created with GITHUB_TOKEN does not
      # trigger another workflow, so a separate workflow listening for `release: published`
      # would never run.
      - name: Move the major tag
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # Accept v1.2.3 and 1.2.3, and refuse anything else, so a pre-release never moves
          # a tag that callers depend on.
          if [[ ! "$TAG" =~ ^v?([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${TAG} is not a plain semver release. The major tag stays where it is."
            exit 0
          fi

          major="v${BASH_REMATCH[1]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/${major}"

          echo "::notice::${major} now points at ${TAG}."
