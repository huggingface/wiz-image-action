name: Lint

# These actions are shell inside YAML, and a public action has no other safety net here.
on:
  pull_request:
    paths: ['.github/workflows/**', '*/action.yml', '*.sh', '*.py']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '*/action.yml', '*.sh', '*.py']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned release tarball rather than the install script from `main`, so this does not
      # execute a mutable remote script to lint a repository that asks its callers to pin.
      - name: Lint the workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          # -verbose lists the files it checked, so a silent pass cannot be mistaken
          # for having checked nothing.
          ./actionlint -color -verbose

      # actionlint reads workflows only, so the shell in the two composite actions needs its
      # own pass. Extract each `run:` block and give it to shellcheck.
      - name: Shellcheck the composite action steps
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/steps"

          python3 - <<'PY'
          import os
          import pathlib
          import yaml

          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "steps"
          for manifest in ("scan/action.yml", "register/action.yml"):
              action = yaml.safe_load(open(manifest))
              for index, step in enumerate(action["runs"]["steps"]):
                  if "run" not in step:
                      continue
                  name = f"{manifest.split('/')[0]}-{index}.sh"
                  (out / name).write_text("#!/usr/bin/env bash\n" + step["run"])
                  print(f"wrote {name} for step {step.get('name', index)!r}")
          PY

          shellcheck --shell=bash --severity=warning install.sh "${RUNNER_TEMP}"/steps/*.sh
          echo "install.sh and every composite step passed shellcheck."

      # summary.py renders whatever the Wiz CLI wrote. Running it against a recorded
      # report is the only way to know the markdown still comes out, since a broken
      # summary is swallowed by the `|| true` that keeps it from failing a scan.
      - name: Check summary.py
        run: |
          set -euo pipefail
          python3 -m py_compile summary.py

          cat > "${RUNNER_TEMP}/report.json" <<'JSON'
          {
            "scanOriginResource": {"digest": "sha256:0000"},
            "policies": [{"name": "Default vulnerabilities policy"}],
            "reportUrl": "https://example.invalid/report",
            "result": {"analytics": {"vulnerabilities": {"criticalCount": 7, "totalCount": 7, "unfixedCount": 2}}}
          }
          JSON
          out=$(python3 summary.py "${RUNNER_TEMP}/report.json" repo/image:tag failed)
          for want in '❌' 'repo/image:tag' 'sha256:0000' '| Vulnerabilities | 7 |' \
                      '2 of the vulnerabilities have no fix available.' \
                      'Default vulnerabilities policy' 'https://example.invalid/report'; do
            grep -qF "$want" <<<"$out" || { echo "::error::summary.py lost: $want"; echo "$out"; exit 1; }
          done

          echo '{}' > "${RUNNER_TEMP}/empty.json"
          python3 summary.py "${RUNNER_TEMP}/empty.json" repo/image:tag passed \
            | grep -qF 'No vulnerabilities, secrets or malware found.'

          echo "summary.py renders both shapes."
