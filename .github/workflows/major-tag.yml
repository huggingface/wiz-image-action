name: Move the major tag

# Consumers pin `@v1`, so that tag has to follow every release. `contents: write` is
# declared because the default token is read-only and cannot push a tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move the major tag to this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # Accept v1.2.3 and 1.2.3, and reject a pre-release such as v1.2.3-rc.1,
          # which must never move a tag that consumers depend on.
          if ! printf '%s' "$TAG" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::${TAG} is not a plain semver release. The major tag stays where it is."
            exit 0
          fi

          major="v$(printf '%s' "$TAG" | sed -E 's/^v?([0-9]+)\..*/\1/')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Point at the commit rather than the release tag, so this never depends on the
          # tag object having been fetched.
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/${major}"

          echo "::notice::${major} now points at ${TAG}."
